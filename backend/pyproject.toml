[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-league-hub"
version = "0.1.0"
description = "ESPN Fantasy Football league hub: standings, ratings, playoffs, PDFs"
requires-python = ">=3.9"
dependencies = [
    "espn-api>=0.45.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.0",
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.1",
    "python-multipart>=0.0.12",
    "eval-type-backport>=0.2.0",
]

[project.scripts]
ff-hub = "app.cli:app"

[tool.setuptools]
packages = ["app", "app.espn", "app.domain", "app.schemas", "app.exporters"]
